<script type="application/json" data-for="htmlwidget-52fe4992a999f01b55cf">{"x":{"tag":{"name":"Reactable","attribs":{"data":{"label":["June's Submission","Soren's Submission","Slugcat's Submission","Marsupial's Submission","Stellaria's Submission","owo's Submission","Xen's Submission","Damascus' Submission","Ellie's Submission","Red's Submission","Stokes' Submission","Eillur Dekarios' Submission","Byleth's Submission","Virtue's Submission","Jerma1's Submission","Myra's Submission","Quail's Submission","Crash's Submission","Bungus' Submission"],"submitter":["June","Soren","slugcat","Marsupial","Stellaria","owo","Xen","Damascus","Ellie","Red","Stokes","Eillur Dekarios","byleth","Virtue","Jerma1","Myra","Quail","Crash","Bungus"],"submitter_pronoun":["He/They/Kit","He/Him","They/Them","He/Him","She/Her","She/They","He/They","He/Him","She/They","He/Him","Any Pronouns","He/Him","They/Them","He/They","She/Her","They/Them","She/Her. They/Them. He/Him","Any Pronouns","He/Him"],"game":["Runescape: Dragonwilds. Jagex Ltd. 2025. Windows PC.","Baldur's Gate III. Larian Studios. 2023. Windows PC.","Stardew Valley. Designed by Eric Barone. ConcernedApe. 2016. PlayStation 4.","Animal Crossing: Pocket Camp Complete. Developed by Nintendo Cube. Nintendo. 2017. iOS.","Baldur's Gate III. Larian Studios. 2023. Windows PC.","Pokemon Sword. Nintendo. 2019. Nintendo Switch.","Minecraft. Mojang Studios. 2009. Windows PC.","Need for Speed: Heat. Electronic Arts. 2019. Windows PC.","The Elder Scrolls V: Skyrim. Bethesda Studios. 2011. Microsoft Xbox 360.","Stardew Valley. Designed by Eric Barone. ConcernedApe. 2016. PlayStation 4.","Sea of Thieves. Rare Studios. 2018. Microsoft Xbox One.","Baldur's Gate III. Larian Studios. 2023. Windows PC.","Cyberpunk 2077. CD Projekt Red. 2022. Xbox Series X.","Splatoon 3. Nintendo. 2022. Nintendo Switch.","Team Fortress 2. Valve Corporation. 2007. Nintendo Switch.","Baldur's Gate III. Larian Studios. 2023. Windows PC.","Baldur's Gate III. Larian Studios. 2023. Windows PC.","Stardew Valley. Designed by Eric Barone. ConcernedApe. 2016. PlayStation 4.","Space Station 14. Space Wizards Foundation. 2024. Windows PC."],"avatar_pronouns":["He/Him","They/Them","He/Him","He/Him","She/Her","She/They","He/Him","He/Him","She/Her","He/Him","They/Them","He/Him","They/Them","They/Them","They/Them","They/Them","He/Him","She/Her","He/Him"],"why_this_game":["\"It's a blast to play and my current obsession.\"","\"BG3 is one of my favorite games to create characters in because the character creator has so many options, and the character you're playing directly impacts story choices and game-play. When I first started playing the game, I restarted multiple times just to make new characters and see what changed in-game based on that. It also helps that BG3 has a lot of options for gender expression in terms of voice, body type, genitals, and more. Over time, I have played many different characters with different gender expressions.\"","\"I mostly play Stardew Valley with my friends. I don't play games with character creation. I play more games where you don't get to choose who you play as.\"","\"Animal Crossing is one of the few games where I play as myself instead of as somebody else.\"","\"Well.... To be honest, Baldur's Gate 3 wasn't my first choice - that character is my 3rd-most (hah) self-identifying character. My first choice would be the avatar that I made for VRChat, then for FFXIV. However, those games aren't quite singleplayer now are they? This Baldur's Gate 3 character is still good to use though! She is based on my VRChat avatar (who is based on me).\"","\"Because it has good customization and I had it on me. I love Pokemon.\"","\"Because I play Minecraft the most out of any other video game, and out of the games I consistently play it has the most variable character creation function.\"","\"It's the only game that I have a custom character in. Normally I choose games with a pre-established player character, because I'd rather play 'someone else's story' than my own.\"","\"Not many games that I play have that level of customization, so this is the most recent game I could develop a character I identify better with (she's an elf, so it's not really me, but that fits the fantasy element).\"","\"Stardew is really the only game I play consistently.\"","\"Sea of Thieves is one of the only games I have where you can customize a character. Also i have 350 hours on the game.\"","\"I’m autistic, and have been playing DnD for 15 years and am really into BG3 (special interest), I also love how diverse and safe the character creation is!! You can pick genitals, pronouns, voices, and more! It’s super inclusive (compared to other stuff)!\"","\"Its my favorite game besides marvel rivals and I think Cyberpunk is a good example of a game that tried to make trans representation and failed spectacularly.\"","\"Lots of self customization and fashion options :]\"","\"I picked that one of 9 characters I have cosmetics for because I think it best encapsulates the general theme of the cosmetic loadout I made which is wintry! Pyro has that cute little face mask + the sweater it all comes together nicely.\"","\"I really enjoy it, and I feel like my character fits me really well.\"","\"There are admittedly not many games with diverse character creation available. My other choices were Cyberpunk 2077 (which doesn't have a nonbinary option and has streamlined romance options based on your combination of sex and gender) and Mass Effect (which forces you into a binary with less freedom with character design- which I don't blame considering how old it is). Baldur's Gate 3 made me feel able to make my character my own. I could give them any voice, body type, and genitals without feeling forced by the game to make certain choices, especially when it came to romance.\"","\"Stardew Valley is the video game I've played the most (that also has a character customizer). I've been playing it on and off since the pandemic and it's provided me a lot of comfort.\"","\"It's a multiplayer roleplaying game and I find it a lot of fun.\""],"avatar_relationship":["\"I use it as an outlet for the expression I don't have the funds for.\"","\"Character creation for me has been both a way to express my own gender identity and a way to explore other gender expressions, even if they aren't what I strictly identify with. Though I personally identify as transmasc and use he/him pronouns, my characters in BG3 usually fall into she/they, he/they, and they/them territory with any combination of masculine and feminine features. I think the only common trait shared by my BG3 characters is that none of them really conform to a binary gender. Since the game lets you mix and match physical characteristics, voice types, and clothes, I don't think I have made any characters that could be identified as a cisgender man or woman. Essentially, there's always some kind of gender fuckery going on. Perhaps this is a reflection of my own personal resistance to identify with a binary gender. In other games that don't have the same level of customization, I usually create masculine female characters or feminine male characters based on clothing options/names. I just think playing gender-non-conforming characters is neat.\"","I feel this kind of game gives people a judgment-free outlet to explore gender identity. Your appearance in the game doesn't affect the gameplay other than your own experience playing as something you created. Whether the character created is something that represents you or just some silly person you made, it allows for a connection to really immerse you into a game.","\"I used Animal Crossing (though New Horizons, not Pocket Camp) at the beginning of my transition to experiment with my personal sense of style (different hair cuts and colors, different clothing options, etc.). It's a game that encourages you to play as yourself and identify with your character. In other single-player games with character creators that I play, like Stardew Valley or No Man's Sky (both of those have multiplayer modes but I play them in singleplayer), I do usually make characters with the same gender identity as myself (male), and with styles that I find appealing, but they are other people and I give them different names and motivations. I use them to explore gender as well, but in more of a fantasy context (I can be a badass masculine fighter in those games, or an angel with wings, or I particularly like playing No Man's Sky as a Construct who has to build himself from scratch as an allegory for building my own life as a trans person), whereas I keep my Animal Crossing outfits realistic to things I might actually wear.\"","\"She is quite literally me with a few edits to personal preference, like the more purple-ish hue to hair. For me, player-made avatars go beyond self-affirmation and head towards the territory of embodiment in the game. You know, like how it's supposed to be for cisgender folks.\"","\"I just made someone I found pretty.\"","\"I think it can be a really critical way to engage in exploration with your self-expression, particularly in an environment where there is no judgement from anyone around you - in a society that's becoming increasingly transphobic and homophobic, these avenues are vital for the continuation of the trans community. Gender is also impacted by SO much within your own life that it's even better when games allow you to put aspects of your personality (interests, likes, dislikes, etc) to really understand how you and your identity interact with the world.\"","\"When I played games pre-transition, picking the gender of your character was automatically assumed to be your gender. When I played online, people assumed me to be male. I wasn't allowed to express myself offline, but online I didn't even have to express. I didn't have to tell someone my pronouns and hope it would be respected. I didn't have to fumble through explanations of transness. I just got to be a guy, playing with a bunch of other guys. Hearing people in voice chat call me by he/him pronouns automatically was very comforting. It was also interesting to play around with clothing options. NFS:Heat doesn't restrict clothes to gender. Male characters can wear crop tops. Female characters can wear baggy jeans. When creating my character at first, I tried many combinations of clothing and character models. It helped me understand that my identity, expression, and body transition goals are all explicitly masculine (as opposed to some transmasculine people who may feel more comfortable with feminine expression when their identities are affirmed).\"","\"I love being able to create a character that is closer to how I'd like to see myself. No level of real life can match the way I see myself. It's great to be able to play with my own self image and see what 'fits' me. (There is another model I have for VR Chat which has a different quality, but I wasn't sure if that qualifies for a game, plus it's a model I'm worknig on, so I can't get an in-game screenshot yet.)\"","\"I am a trans male (FTM) so when I create a character in a video game, I want them to represent how i see myself irl. I chose a male character and dressed him in a simple striped shirt and shorts, since this is something I would also wearl irl. I also decided to add items to my character that aren't realistic, such a duck beak and a party hat. Neither of these are things i have lol but I feel like it still speaks to my gender identity. The duck beak makes my character inhuman in a way, but this is also how I see myself due to gender and identity as an autistic person.\"","\"I always try to go for the most androgynous look i can, even if there are only female or male bases.\"","\"Before I came out as a trans man, I always found myself wanting to play “the boy character”. When I first found games that I could create my own characters, I always created characters who just looked like a “boy version” of me at the time, and I’d feel very happy playing the games. As I’ve started transitioning, and still suffer from dysphoria (but more body dysmorphia now that I’ve gotten top surgery), I get to make characters that may not look like me, but are still men that I find cool, aesthetically appealing, or attractive. In BG3 you can also choose genitals like I said, and romance characters, and as a gay trans man, I enjoyed being able to play a male character with female genitalia and romance a cis man - it made me feel less uncomfortable about navigating the dating field and always feeling unseen. I love the BG3 character customization (I think it has some places it could improve - like adding plus-sized characters, etc), and it just makes me happy to know that I can play a cis man, trans man, cis woman, trans woman, or even a nonbinary character! Character creation allowed me to explore my gender before coming out, and now that I have it allows me to affirm that gender identity and (in Baldur’s Gate’s case) allows me to also affirm my sexuality!\"","\"I try to make my characters similar to me in gender and sexuality (AFAB trans nonbinary and preference for fem and nonbinary partners). This character I had to make a female presentation and voice to get Judy (a lesbian NPC) as a love interest. If I had more autonomy with this or mods I would've made them more neutral. I gave them no visible genitals or nipples similar to my own transition goals but I would've preferred to not have a chest. I'm actually getting top surgery in real life next year. Also their hair is purple and in space buns which is my favorite color/style but I prefer my hair shorter and more androgynous in real life. It's kind of like playing as a more feminine version of myself that I would be more comfortable expressing if people didn't constantly misgender me in real life.\"","\"Use it to explore and lean further into assets of my self-identity I would otherwise not be able to do in person.\"","\"I could imagine the subconscious visual choices and clothing items could reflect my own desires and wants for my appearance or outward identity, and sort in that way is both a goalline and a source of projection.\"","\"It allows me to explore how I would like to present myself in a world where people don't assume what I am.\"","\"My gender identity is up in the air. Mostly, I feel Agender and don't necessarily care how I'm addressed. Sometimes I feel nonbinary and would prefer to be addressed as they/them. However, I don't feel comfortable expressing my preferred identity in real life, so just default to my birth sex since that's easier. In video games, however, I can become whoever I want. Since I prefer single player games, I especially feel able to be myself without judgement. The characters I make tend to have a mixture of feminine and masculine traits, which is usually only possible with diverse character creators. The character I submitted is male with a masculine voice, but has a more feminine body. It's similar to how I myself am female in body, but don't particularly mentally connect with being a woman. Character creators have allowed me to explore how I see myself and how I want to be seen by others. Some of the first character creators I encountered were in text-based interactive fiction games (e.g. Choice of Games LLC) where there are no visuals, you just state your gender and appearance. Going from that form of mentally envisioning my character to games like Baldur's Gate 3 that let me physically see them has helped me feel more comfortable with myself. Even if the world would find me strange, I have a sense of internal acceptance where I know it's okay to not fit into what someone expects of me.\"","The nice thing about single-player games is that you can literally make your character look however, and everyone in the game still treats you the same. This allows room for exploration -- my first two SV characters were versions of myself, but in this third world I'm a woman farmer who also happens to have a beard. (Her name is Griselda.) Stardew Valley is also one of those games where the movement of just a few pixels can entirely change how your character looks, and it's not as if the base characters are highly gendered anyway. (You do pick male/female in the character creation screen, but that only affects the pronouns NPCs call you.)","\"For RP games, I don't feel like my characters need to reflect my own gender identity since I'm doing a bit; but I still end up usually playing guys and/or gender diverse characters in some form. Before figuring myself out, I would often try playing as a girl (either because there was more customization available or I felt it was what I 'had to do' because I was stuck being one IRL.) Later on as my egg cracked I started playing guys in character-creator games more, and that is what I usually do now. I'll play as a guy if it's representing me, and if it's a separate character they're likely still masculine. I think making chars. in singleplayer games (and in general through RP/etc) lets you explore aspects of yourself or things like that that you don't get to (or shouldn't) do in real life (like making an evil char etc), but also often reflects a bit of yourself in them. Since all gender is a sort of performance, having a character perform it in a game definitely lets you explore stuff.\""],"object_type":["Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot","Screenshot"]},"columns":[{"id":"label","name":"label","type":"character"},{"id":"submitter","name":"submitter","type":"character"},{"id":"submitter_pronoun","name":"submitter_pronoun","type":"character"},{"id":"game","name":"game","type":"character"},{"id":"avatar_pronouns","name":"avatar_pronouns","type":"character"},{"id":"why_this_game","name":"why_this_game","type":"character"},{"id":"avatar_relationship","name":"avatar_relationship","type":"character"},{"id":"object_type","name":"object_type","type":"character"}],"searchable":true,"defaultPageSize":15,"highlight":true,"bordered":true,"dataKey":"33b95f8856fe17135cac9cb18544de2f"},"children":[]},"class":"reactR_markup"},"evals":[],"jsHooks":[]}</script>

    const xrefs = window.document.querySelectorAll('a.quarto-xref');
    const processXRef = (id, note) => {
      // Strip column container classes
      const stripColumnClz = (el) => {
        el.classList.remove("page-full", "page-columns");
        if (el.children) {
          for (const child of el.children) {
            stripColumnClz(child);
          }
        }
      }
      stripColumnClz(note)
      if (id === null || id.startsWith('sec-')) {
        // Special case sections, only their first couple elements
        const container = document.createElement("div");
        if (note.children && note.children.length > 2) {
          container.appendChild(note.children[0].cloneNode(true));
          for (let i = 1; i < note.children.length; i++) {
            const child = note.children[i];
            if (child.tagName === "P" && child.innerText === "") {
              continue;
            } else {
              container.appendChild(child.cloneNode(true));
              break;
            }
          }
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(container);
          }
          return container.innerHTML
        } else {
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(note);
          }
          return note.innerHTML;
        }
      } else {
        // Remove any anchor links if they are present
        const anchorLink = note.querySelector('a.anchorjs-link');
        if (anchorLink) {
          anchorLink.remove();
        }
        if (window.Quarto?.typesetMath) {
          window.Quarto.typesetMath(note);
        }
        if (note.classList.contains("callout")) {
          return note.outerHTML;
        } else {
          return note.innerHTML;
        }
      }
    }
    for (var i=0; i<xrefs.length; i++) {
      const xref = xrefs[i];
      tippyHover(xref, undefined, function(instance) {
        instance.disable();
        let url = xref.getAttribute('href');
        let hash = undefined; 
        if (url.startsWith('#')) {
          hash = url;
        } else {
          try { hash = new URL(url).hash; } catch {}
        }
        if (hash) {
          const id = hash.replace(/^#\/?/, "");
          const note = window.document.getElementById(id);
          if (note !== null) {
            try {
              const html = processXRef(id, note.cloneNode(true));
              instance.setContent(html);
            } finally {
              instance.enable();
              instance.show();
            }
          } else {
            // See if we can fetch this
            fetch(url.split('#')[0])
            .then(res => res.text())
            .then(html => {
              const parser = new DOMParser();
              const htmlDoc = parser.parseFromString(html, "text/html");
              const note = htmlDoc.getElementById(id);
              if (note !== null) {
                const html = processXRef(id, note);
                instance.setContent(html);
              } 
            }).finally(() => {
              instance.enable();
              instance.show();
            });
          }
        } else {
          // See if we can fetch a full url (with no hash to target)
          // This is a special case and we should probably do some content thinning / targeting
          fetch(url)
          .then(res => res.text())
          .then(html => {
            const parser = new DOMParser();
            const htmlDoc = parser.parseFromString(html, "text/html");
            const note = htmlDoc.querySelector('main.content');
            if (note !== null) {
              // This should only happen for chapter cross references
              // (since there is no id in the URL)
              // remove the first header
              if (note.children.length > 0 && note.children[0].tagName === "HEADER") {
                note.children[0].remove();
              }
              const html = processXRef(null, note);
              instance.setContent(html);
            } 
          }).finally(() => {
            instance.enable();
            instance.show();
          });
        }
      }, function(instance) {
      });
    }
        let selectedAnnoteEl;
        const selectorForAnnotation = ( cell, annotation) => {
          let cellAttr = 'data-code-cell="' + cell + '"';
          let lineAttr = 'data-code-annotation="' +  annotation + '"';
          const selector = 'span[' + cellAttr + '][' + lineAttr + ']';
          return selector;
        }
        const selectCodeLines = (annoteEl) => {
          const doc = window.document;
          const targetCell = annoteEl.getAttribute("data-target-cell");
          const targetAnnotation = annoteEl.getAttribute("data-target-annotation");
          const annoteSpan = window.document.querySelector(selectorForAnnotation(targetCell, targetAnnotation));
          const lines = annoteSpan.getAttribute("data-code-lines").split(",");
          const lineIds = lines.map((line) => {
            return targetCell + "-" + line;
          })
          let top = null;
          let height = null;
          let parent = null;
          if (lineIds.length > 0) {
              //compute the position of the single el (top and bottom and make a div)
              const el = window.document.getElementById(lineIds[0]);
              top = el.offsetTop;
              height = el.offsetHeight;
              parent = el.parentElement.parentElement;
            if (lineIds.length > 1) {
              const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
              const bottom = lastEl.offsetTop + lastEl.offsetHeight;
              height = bottom - top;
            }
            if (top !== null && height !== null && parent !== null) {
              // cook up a div (if necessary) and position it 
              let div = window.document.getElementById("code-annotation-line-highlight");
              if (div === null) {
                div = window.document.createElement("div");
                div.setAttribute("id", "code-annotation-line-highlight");
                div.style.position = 'absolute';
                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {

            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
